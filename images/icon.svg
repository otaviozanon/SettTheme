<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente dourado para a borda -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>

    <!-- Gradiente laranja para o raio -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6500;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#21252b" stroke="url(#goldGradient)" stroke-width="4"/>

  <!-- Lightning bolt (raio laranja) -->
  <path d="M 72 20 L 45 68 L 60 68 L 52 108 L 85 58 L 68 58 Z"
        fill="url(#orangeGradient)"
        stroke="#FF8C00"
        stroke-width="2"
        stroke-linejoin="round"/>
</svg>
