  <g font-family="JetBrains Mono,Fira Code,monospace" font-size="12.5">
    <text x="58" y="62"><tspan fill="#e06c75">import</tspan><tspan fill="#abb2bf"> { </tspan><tspan fill="#d7dae0">User</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#d7dae0">ApiResponse</tspan><tspan fill="#abb2bf"> } </tspan><tspan fill="#e06c75">from</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e5c07b">'./types'</tspan><tspan fill="#abb2bf">;</tspan></text>
    <text x="58" y="98"><tspan fill="#7f848e">// Service for user management with all color demonstrations</tspan></text>
    <text x="58" y="116"><tspan fill="#e5a84b">const</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#d7dae0">API_URL</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e5a84b">=</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e5c07b">"https://api.example.com"</tspan><tspan fill="#abb2bf">;</tspan></text>
    <text x="58" y="134"><tspan fill="#e5a84b">let</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#d7dae0">retryCount</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e5a84b">=</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#d19a66">0</tspan><tspan fill="#abb2bf">;</tspan></text>
    <text x="58" y="152"><tspan fill="#e5a84b">var</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#d7dae0">isDebugMode</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e5a84b">=</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#98c379">false</tspan><tspan fill="#abb2bf">;</tspan></text>
    <text x="58" y="188"><tspan fill="#e06c75">class</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e5c07b">UserService</tspan><tspan fill="#abb2bf"> {</tspan></text>
    <text x="78" y="224"><tspan fill="#e06c75">async</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#98c379">fetchUsers</tspan><tspan fill="#abb2bf">(): </tspan><tspan fill="#e5c07b">Promise</tspan><tspan fill="#e5a84b">&lt;</tspan><tspan fill="#e5c07b">User</tspan><tspan fill="#abb2bf">[]</tspan><tspan fill="#e5a84b">&gt;</tspan><tspan fill="#abb2bf"> {</tspan></text>
    <text x="98" y="242"><tspan fill="#e5a84b">const</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#d7dae0">response</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e5a84b">=</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e06c75">await</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#98c379">fetch</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#d7dae0">API_URL</tspan><tspan fill="#abb2bf">);</tspan></text>
    <text x="98" y="278"><tspan fill="#e06c75">if</tspan><tspan fill="#abb2bf"> (</tspan><tspan fill="#d7dae0">response</tspan><tspan fill="#e06c75">.ok</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e5a84b">&amp;&amp;</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#d7dae0">response</tspan><tspan fill="#e06c75">.status</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e5a84b">===</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#d19a66">200</tspan><tspan fill="#abb2bf">) {</tspan></text>
    <text x="118" y="296"><tspan fill="#e5a84b">const</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#d7dae0">data</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e5a84b">=</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e06c75">await</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#d7dae0">response</tspan><tspan fill="#e06c75">.json</tspan><tspan fill="#abb2bf">();</tspan></text>
    <text x="118" y="314"><tspan fill="#e06c75">return</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#d7dae0">data</tspan><tspan fill="#e06c75">.users</tspan><tspan fill="#e5a84b">?.</tspan><tspan fill="#e06c75">filter</tspan><tspan fill="#abb2bf">((</tspan><tspan fill="#d7dae0">u</tspan><tspan fill="#abb2bf">) </tspan><tspan fill="#e5a84b">=&gt;</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#d7dae0">u</tspan><tspan fill="#e06c75">.active</tspan><tspan fill="#abb2bf">);</tspan></text>
    <text x="98" y="332"><tspan fill="#abb2bf">} </tspan><tspan fill="#e06c75">else</tspan><tspan fill="#abb2bf"> {</tspan></text>
    <text x="118" y="350"><tspan fill="#e06c75">throw</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e06c75">new</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e5c07b">Error</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#e5c07b">`HTTP error! status: </tspan><tspan fill="#abb2bf">${</tspan><tspan fill="#d7dae0">response</tspan><tspan fill="#e06c75">.status</tspan><tspan fill="#abb2bf">}</tspan><tspan fill="#e5c07b">`</tspan><tspan fill="#abb2bf">);</tspan></text>
    <text x="98" y="368"><tspan fill="#abb2bf">}</tspan></text>
    <text x="78" y="386"><tspan fill="#abb2bf">}</tspan></text>
    <text x="78" y="422"><tspan fill="#98c379">updateUser</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#d7dae0">user</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#e5c07b">User</tspan><tspan fill="#abb2bf">): </tspan><tspan fill="#e5c07b">ApiResponse</tspan><tspan fill="#abb2bf"> {</tspan></text>
    <text x="98" y="440"><tspan fill="#e5a84b">const</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#d7dae0">payload</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#e5a84b">=</tspan><tspan fill="#abb2bf"> {</tspan></text>
    <text x="118" y="458"><tspan fill="#56b6c2">id</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#d7dae0">user</tspan><tspan fill="#e06c75">.id</tspan><tspan fill="#abb2bf">,</tspan></text>
    <text x="118" y="476"><tspan fill="#56b6c2">name</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#d7dae0">user</tspan><tspan fill="#e06c75">.name</tspan><tspan fill="#abb2bf">,</tspan></text>
    <text x="118" y="494"><tspan fill="#56b6c2">email</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#d7dae0">user</tspan><tspan fill="#e06c75">.email</tspan><tspan fill="#abb2bf">,</tspan></text>
    <text x="118" y="512"><tspan fill="#56b6c2">active</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#98c379">true</tspan><tspan fill="#abb2bf">,</tspan></text>
    <text x="118" y="530"><tspan fill="#56b6c2">timestamp</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#d7dae0">Date</tspan><tspan fill="#e06c75">.now</tspan><tspan fill="#abb2bf">()</tspan></text>
    <text x="98" y="548"><tspan fill="#abb2bf">};</tspan></text>
    <text x="98" y="584"><tspan fill="#d7dae0">console</tspan><tspan fill="#e06c75">.log</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#e5c07b">`Updating user </tspan><tspan fill="#abb2bf">${</tspan><tspan fill="#d7dae0">user</tspan><tspan fill="#e06c75">.name</tspan><tspan fill="#abb2bf">}</tspan><tspan fill="#e5c07b"> (ID: </tspan><tspan fill="#abb2bf">${</tspan><tspan fill="#d7dae0">user</tspan><tspan fill="#e06c75">.id</tspan><tspan fill="#abb2bf">}</tspan><tspan fill="#e5c07b">)`</tspan><tspan fill="#abb2bf">);</tspan></text>
    <text x="98" y="602"><tspan fill="#e06c75">return</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#c678dd">this</tspan><tspan fill="#e06c75">.sendRequest</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#e5c07b">'PUT'</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#d7dae0">payload</tspan><tspan fill="#abb2bf">);</tspan></text>
    <text x="78" y="620"><tspan fill="#abb2bf">}</tspan></text>
    <text x="78" y="656"><tspan fill="#e06c75">private</tspan><tspan fill="#abb2bf"> </tspan><tspan fill="#98c379">sendRequest</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#d7dae0">method</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#e5c07b">string</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#d7dae0">data</tspan><tspan fill="#e5a84b">?</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#e06c75">any</tspan><tspan fill="#abb2bf">) {</tspan></text>
    <text x="98" y="674"><tspan fill="#7f848e">// Implementation here...</tspan></text>
    <text x="78" y="692"><tspan fill="#abb2bf">}</tspan></text>
